<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KNX-Gruppenmonitor und Busdiagnose">
  <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Busclear">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Busclear</title>
  <link rel="manifest" href="manifest.json">
  <!-- Bis Flutter geladen ist: Hintergrund wie der Startbildschirm (Palette.launchBackground). -->
  <style>html, body { background: #FFFFFF; } @media (prefers-color-scheme: dark) { html, body { background: #000000; } }</style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Das Passkeys-Plugin ruft beim Start PasskeyAuthenticator.init() auf und
       bricht ohne sein bundle.js den ganzen Start ab. Im Web gibt es keine
       Passkeys (Account.passkeysAvailable), daher nur ein leerer Platzhalter. -->
  <script>window.PasskeyAuthenticator = window.PasskeyAuthenticator || { init() {} };</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
