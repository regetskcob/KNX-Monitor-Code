<?xml version="1.0" encoding="UTF-8"?>
<!-- Beispielgerät für die Herstellergrafik-Pipeline: Schaltaktor 8-fach,
     4 TE (72 × 90 mm), Frontansicht, LEDs aus, Beschriftungsfelder leer.
     Selbst gezeichnet, kein reales Produkt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 90" width="72mm" height="90mm">
  <defs>
    <g id="screw">
      <circle r="2.5" fill="#a7adb2" stroke="#7d8388" stroke-width="0.25"/>
      <path d="M-1.6 1.6 L1.6 -1.6" stroke="#5f656a" stroke-width="0.45" stroke-linecap="round"/>
    </g>
    <g id="channel">
      <!-- LED (aus), Handbedienungstaste, leeres Beschriftungsfeld -->
      <circle cx="10.5" cy="3.4" r="1.1" fill="#c8ccc8" stroke="#9a9e9a" stroke-width="0.2"/>
      <rect x="2" y="6.6" width="10" height="4" rx="0.8" fill="#dcdcd7" stroke="#a9a9a3" stroke-width="0.25"/>
      <rect x="1" y="12" width="12" height="4.2" rx="0.3" fill="#ffffff" stroke="#c4c4be" stroke-width="0.2"/>
    </g>
  </defs>

  <!-- Gehäuse -->
  <rect x="0.15" y="0.15" width="71.7" height="89.7" rx="1.6" fill="#e6e6e1" stroke="#a8a8a2" stroke-width="0.3"/>

  <!-- Klemmen oben: Ausgänge 1–8 -->
  <rect x="2" y="1.2" width="68" height="12.4" rx="0.8" fill="#d2d2cc" stroke="#a8a8a2" stroke-width="0.25"/>
  <use href="#screw" x="6.25" y="6.4"/>
  <use href="#screw" x="14.75" y="6.4"/>
  <use href="#screw" x="23.25" y="6.4"/>
  <use href="#screw" x="31.75" y="6.4"/>
  <use href="#screw" x="40.25" y="6.4"/>
  <use href="#screw" x="48.75" y="6.4"/>
  <use href="#screw" x="57.25" y="6.4"/>
  <use href="#screw" x="65.75" y="6.4"/>

  <!-- Frontplatte -->
  <rect x="1" y="15" width="70" height="60" rx="1" fill="#f1f1ed" stroke="#b9b9b3" stroke-width="0.25"/>
  <rect x="3" y="17.2" width="11" height="4.2" rx="0.6" fill="#2f6f5e"/>
  <path d="M4.6 18.4 h7.8 M4.6 20.2 h5.2" stroke="#f1f1ed" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M16 18.6 h22 M16 20.4 h14" stroke="#9c9c96" stroke-width="0.5" stroke-linecap="round"/>

  <!-- Kanäle 1–4 und 5–8 (je 14 × 17 mm) -->
  <use href="#channel" x="3" y="25"/>
  <use href="#channel" x="18.5" y="25"/>
  <use href="#channel" x="34" y="25"/>
  <use href="#channel" x="49.5" y="25"/>
  <use href="#channel" x="3" y="45"/>
  <use href="#channel" x="18.5" y="45"/>
  <use href="#channel" x="34" y="45"/>
  <use href="#channel" x="49.5" y="45"/>

  <!-- Kanalnummern als Pfade (Strichziffern) -->
  <g stroke="#55554f" stroke-width="0.35" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.4 26.6 l0.8 -0.6 v3"/>
    <path d="M20.6 26.4 q0.8 -0.6 1.6 0 q0.4 0.6 -0.2 1.2 l-1.4 1.4 h1.8"/>
    <path d="M36.1 26.2 h1.6 l-0.9 1.1 q1.1 0 1.0 0.9 q-0.3 0.9 -1.7 0.6"/>
    <path d="M52.6 26 l-1 2 h1.8 M52.8 27.2 v1.8"/>
    <path d="M6.9 46 h-1.4 l-0.2 1.3 q1.4 -0.4 1.6 0.6 q-0.2 1.1 -1.7 0.8"/>
    <path d="M22.3 46.1 q-1.5 -0.4 -1.6 1.4 q0 1.4 0.9 1.4 q0.8 0 0.8 -0.8 q0 -0.8 -0.8 -0.8 q-0.6 0 -0.9 0.6"/>
    <path d="M36.1 46 h1.8 l-1.2 2.9"/>
    <ellipse cx="52.6" cy="46.6" rx="0.65" ry="0.6"/>
    <ellipse cx="52.6" cy="48.15" rx="0.8" ry="0.8"/>
  </g>

  <!-- Programmierung: LED (aus) und Taste -->
  <path d="M44 68.4 h6" stroke="#9c9c96" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="58" cy="68.4" r="1.1" fill="#d6c9c9" stroke="#a39696" stroke-width="0.2"/>
  <rect x="61.5" y="66.4" width="6.5" height="4" rx="0.8" fill="#dcdcd7" stroke="#a9a9a3" stroke-width="0.25"/>

  <!-- Klemmen unten: Phasen und Busklemme -->
  <rect x="2" y="76.4" width="68" height="12.4" rx="0.8" fill="#d2d2cc" stroke="#a8a8a2" stroke-width="0.25"/>
  <use href="#screw" x="6.25" y="82.6"/>
  <use href="#screw" x="14.75" y="82.6"/>
  <use href="#screw" x="23.25" y="82.6"/>
  <use href="#screw" x="31.75" y="82.6"/>
  <rect x="57.5" y="79.4" width="5" height="6.4" fill="#c8312b"/>
  <rect x="62.5" y="79.4" width="5" height="6.4" fill="#2a2a2a"/>
</svg>
