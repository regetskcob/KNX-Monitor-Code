# Settings for tool/werkbank (rules: tool/werkbank/STANDARD.md).

WB_APP=knx-monitor

# Products next to the app: Home Assistant add-on (its repository.yaml must
# sit at the root for Home Assistant), the Busclear integration for Home
# Assistant (ha-integration, published as KNX-Monitor-HA), Busclear Box
# busclear.de; internal Dart packages shared by app and server (packages/knx);
# Dockerfile to build the image from the repository alone.
WB_TOP_EXTRA='ha-addon|ha-integration|box|third_party|packages|intern|repository\.yaml|Dockerfile|\.dockerignore'
# Their media, plus the device art sources the app's assets are built from.
WB_MEDIA_EXTRA='intern/|ha-addon/knx_monitor/|ha-integration/custom_components/knx_monitor/brand/|box/case/|tool/device_art/'

# Locally all tests (goldens included); the CI excludes the golden tag.

verify_extra() {
  say "Box scripts"
  # Same files as box-image.yml; without this a style note in a box script only
  # shows up on the box-v* tag (1.9.10: SC2015 in settime.sh).
  if command -v shellcheck >/dev/null; then
    shellcheck box/*.sh box/files/*.sh box/pi-gen/stage-knx-box/prerun.sh \
      box/pi-gen/stage-knx-box/00-knx-box/01-run.sh
  else
    warn "shellcheck missing (brew install shellcheck) – box scripts not linted"
  fi
  box/test-firstboot.sh >/dev/null
  box/test-setup.sh >/dev/null
  # Rules for inactive accounts: only with a Node that runs TypeScript directly.
  if [ -d supabase ] && node -e 'const [a,b]=process.versions.node.split(".").map(Number);process.exit(a>22||(a===22&&b>=18)?0:1)' 2>/dev/null; then
    say "Supabase rules"
    node --test supabase/functions/_shared/*_test.ts >/dev/null
  fi
  say "Web build"
  flutter build web --release --no-web-resources-cdn --no-pub >/dev/null
  say "Package knx"
  (cd packages/knx && dart pub get --enforce-lockfile >/dev/null &&
    dart format --output=none --set-exit-if-changed lib test >/dev/null && dart analyze && dart test >/dev/null)
  say "Add-on server"
  (cd ha-addon/knx_monitor/server && dart pub get --enforce-lockfile >/dev/null &&
    dart format --output=none --set-exit-if-changed bin lib test >/dev/null && dart analyze &&
    dart test && dart compile exe bin/server.dart -o "$(mktemp -d)/server" >/dev/null)
  # Python with Home Assistant's test harness (ha-integration/requirements_test.txt);
  # without it the step is skipped here, KNX-Monitor-HA runs it on every push.
  local ha_python=${HA_VENV:-$HOME/.cache/knx-monitor/ha-venv}/bin/python
  if [ -x "$ha_python" ]; then
    say "Home Assistant integration"
    (cd ha-integration && "$ha_python" -m ruff check -q . && "$ha_python" -m ruff format -q --check . &&
      "$ha_python" -m pytest -q -p no:logging >/dev/null)
  else
    say "Home Assistant integration: skipped (no $ha_python)"
  fi
}

# Built by verify: site/ (busclear.de; draft pages render only locally).
WB_SITE_DIRS='site'

# Store texts and uploads (tool/release.sh notes, UPLOAD=1): app tags are
# app-v<version>; Play's closed test is the track "alpha".
WB_APP_TAG_PREFIX='app-v'
WB_PLAY_PACKAGE='de.kalkar_it.knxmonitor'
WB_PLAY_TRACK='alpha'

# Device tests: the session and the tour (tool/release.sh devicetest).
WB_DEVICETEST_TARGETS='integration_test/session_test.dart integration_test/tour_test.dart'

# Before a device test: the app's data off the device into
# build/devicetest/backup/<device>/ (a lost iPad catalog, 15.10.2026). Without
# a backup – locked device, app not installed – the device is skipped.
devicetest_before() {
  local id=$1 platform=$2 dir="build/devicetest/backup/$1"
  mkdir -p "$dir"
  case "$platform" in
    ios)
      if ! xcrun devicectl device copy from --device "$id" --domain-type appDataContainer \
        --domain-identifier de.regetskcob.knx-monitor --source Library --destination "$dir" >/dev/null 2>&1; then
        warn "  no backup of the app data – unlock the device (and install the app), then again"
        return 1
      fi
      say "  app data backed up to $dir"
      ;;
    macos)
      # The Mac app's sandbox; no container yet means no data to lose.
      local box="$HOME/Library/Containers/de.regetskcob.knx-monitor/Data/Library"
      if [ -d "$box" ]; then
        ditto "$box" "$dir/Library" || { warn "  no backup of the Mac app data"; return 1; }
        say "  app data backed up to $dir/Library"
      fi
      ;;
    android)
      local adb=${ANDROID_HOME:-$HOME/Library/Android/sdk}/platform-tools/adb
      if ! "$adb" -s "$id" exec-out run-as de.kalkar_it.knxmonitor tar cf - files shared_prefs >"$dir/data.tar" 2>/dev/null; then
        warn "  no backup of the app data (run-as needs a debug build of the app on the device)"
        return 1
      fi
      say "  app data backed up to $dir/data.tar"
      ;;
  esac
}

# After a Mac run: quit the app, so instances do not pile up in the Dock.
devicetest_after() {
  [ "$2" = macos ] && osascript -e 'quit app "Busclear"' >/dev/null 2>&1
  return 0
}

# The website busclear.de (site/) on the webspace at do.de, uploaded over FTPS
# (tool/site_ftps.sh, access from the keychain items busclear-ftp and
# knx-monitor-ftp), with the social page /socials/ built from the private
# store/social/ (main checkout or SOCIAL_POSTS); without it the published
# /socials/ stays as it is. knx-monitor.de, the former address, gets a folder of
# its own that redirects to busclear.de (tool/site_redirect/).
WB_SITES='knx=site|https://busclear.de/|hook'
site_deploy_knx() {
  tool/site_ftps.sh "$1" busclear-ftp --keep socials
  # The redirect of knx-monitor.de has five files that hardly ever change; it
  # needs no FTP user of its own. With a keychain item knx-monitor-ftp it is
  # uploaded too, otherwise upload the folder once by hand (do.de file manager).
  local redirect
  redirect="$(dirname "$1")/knx-monitor-redirect"
  if security find-generic-password -s knx-monitor-ftp >/dev/null 2>&1; then
    tool/site_ftps.sh "$redirect" knx-monitor-ftp
  else
    say "knx-monitor.de: no keychain item knx-monitor-ftp – upload $redirect by hand if it changed"
  fi
}
site_post_knx() {
  # knx-monitor.de after the rename: security.txt and the Play video stay, the
  # rest redirects (see tool/site_redirect/knx-monitor.htaccess).
  local redirect
  redirect="$(dirname "$1")/knx-monitor-redirect"
  rm -rf "$redirect"
  mkdir -p "$redirect/play"
  cp tool/site_redirect/knx-monitor.htaccess "$redirect/.htaccess"
  # Only security.txt: passkeys and app links belong to busclear.de, the old
  # domain must not advertise them (apple-app-site-association, assetlinks.json).
  mkdir -p "$redirect/.well-known"
  cp "$1/.well-known/security.txt" "$redirect/.well-known/"
  cp "$1/play/klangquittung.mp4" "$redirect/play/"
  say "Redirect for knx-monitor.de built into $redirect"
  # No buy page (and no offers file) as long as nothing is sold: HUGO_PARAMS_COMMERCE=true.
  if [ "${HUGO_PARAMS_COMMERCE:-}" != true ]; then rm -rf "$1/kaufen" "$1/en/buy"; fi
  local posts=${SOCIAL_POSTS:-store/social/posts}
  if [ -d "$posts" ]; then
    SOCIAL_POSTS=$posts python3 tool/social/preview.py "$1/socials" >/dev/null
    say "Social page built into $1/socials"
  else
    warn "no $posts – /socials/ stays as published"
  fi
}
