# Settings for tool/werkbank (rules: tool/werkbank/STANDARD.md).

WB_APP=knx-monitor

# Products next to the app: Home Assistant add-on (its repository.yaml must
# sit at the root for Home Assistant), KNX Box, teaser site knx-monitor.de;
# internal Dart packages shared by app and server (packages/knx).
WB_TOP_EXTRA='ha-addon|box|teaser|third_party|packages|repository\.yaml'
# Their media, plus the device art sources the app's assets are built from.
WB_MEDIA_EXTRA='ha-addon/knx_monitor/|box/case/|teaser/(assets|static)/|tool/device_art/'

# Locally all tests (goldens included); the CI excludes the golden tag.

verify_extra() {
  say "Box scripts"
  box/test-firstboot.sh >/dev/null
  box/test-setup.sh >/dev/null
  # Rules for inactive accounts: only with a Node that runs TypeScript directly.
  if [ -d supabase ] && node -e 'const [a,b]=process.versions.node.split(".").map(Number);process.exit(a>22||(a===22&&b>=18)?0:1)' 2>/dev/null; then
    say "Supabase rules"
    node --test supabase/functions/_shared/*_test.ts >/dev/null
  fi
  say "Web build"
  flutter build web --release --no-web-resources-cdn --no-pub >/dev/null
  say "Package knx"
  (cd packages/knx && dart pub get --enforce-lockfile >/dev/null &&
    dart format --output=none --set-exit-if-changed lib test >/dev/null && dart analyze && dart test >/dev/null)
  say "Add-on server"
  (cd ha-addon/knx_monitor/server && dart pub get --enforce-lockfile >/dev/null &&
    dart format --output=none --set-exit-if-changed bin lib test >/dev/null && dart analyze &&
    dart test && dart compile exe bin/server.dart -o "$(mktemp -d)/server" >/dev/null)
}

# Landing page (www.regetskcob.de/knx/, tool/deploy_site.sh) and teaser
# (knx-monitor.de, tool/deploy_teaser.sh), built by verify.
WB_SITE_DIRS='site teaser'
