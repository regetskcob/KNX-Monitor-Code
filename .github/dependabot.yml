# Monthly update PRs for CI actions and Dart/Flutter dependencies, one grouped
# PR per ecosystem: every PR on main costs a Copilot review and a CI run.
# Security updates still arrive immediately, independent of this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      app:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /ha-addon/knx_monitor/server
    schedule:
      interval: monthly
    groups:
      addon-server:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /ha-addon/knx_monitor
    schedule:
      interval: monthly
