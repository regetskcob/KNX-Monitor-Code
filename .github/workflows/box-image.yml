# Builds the Busclear Box: bundle (server for arm64, web app, setup.sh) and
# a finished Raspberry Pi OS image (pi-gen). See docs/knx-box.md.
#
# Trigger: tag "box-v<version>" (version as in ha-addon/knx_monitor/config.yaml)
# or manually. Image and bundle stay artifacts of the run;
# `tool/release.sh box <version>` publishes them in the public repo.
#
# On tag pushes cosign signs bundle and image without a key of our own
# (keyless, via the OIDC token of the run); the bundles go into the release
# too. A manual run is never signed, even when started on a tag, and a tag run
# only builds with the pinned pi-gen revision. `tool/release.sh box` publishes
# only runs of the tag push whose signatures verify. Verify:
# docs/release-security.md.
name: Box-Image

on:
  push:
    tags: ['box-v*']
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: pi-gen-Zweig oder -Tag
        default: 2026-10-06-raspios-trixie-arm64

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Check tag against config.yaml
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -E '^version:' ha-addon/knx_monitor/config.yaml | cut -d'"' -f2)
          [ "$GITHUB_REF_NAME" = "box-v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match config.yaml version $version"; exit 1; }
      # PI_GEN_COMMIT is only checked for the default revision: on a tag no
      # other one is allowed, so a release image always has the verified pi-gen.
      - name: Check pi-gen revision on tags
        if: github.ref_type == 'tag'
        env:
          PI_GEN_INPUT: ${{ inputs.pi_gen_ref }}
        run: |
          if [ -n "$PI_GEN_INPUT" ] && [ "$PI_GEN_INPUT" != 2026-10-06-raspios-trixie-arm64 ]; then
            echo "::error::A tag build must use the pinned pi-gen revision, not $PI_GEN_INPUT"
            exit 1
          fi
      - name: Check box scripts
        run: |
          shellcheck box/*.sh box/files/*.sh box/pi-gen/stage-knx-box/prerun.sh \
            box/pi-gen/stage-knx-box/00-knx-box/01-run.sh
          box/test-firstboot.sh
          box/test-setup.sh
      - run: flutter pub get --enforce-lockfile && flutter gen-l10n
      - run: box/bundle.sh --out build/knx-box.tar.gz
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name == 'push' && github.ref_type == 'tag'
      - name: Sign package
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: cosign sign-blob --yes --bundle build/knx-box.tar.gz.sigstore.json build/knx-box.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knx-box-bundle
          path: |
            build/knx-box.tar.gz
            build/knx-box.tar.gz.sigstore.json
          retention-days: 1

  image:
    needs: bundle
    # arm64 runner: pi-gen builds without QEMU, so much faster.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: knx-box-bundle
          path: build
      - name: Build image
        env:
          # Fixed pi-gen revision: a box release should be reproducible.
          PI_GEN_REF: ${{ inputs.pi_gen_ref || '2026-10-06-raspios-trixie-arm64' }}
          # Commit of this tag; unchecked for any other revision chosen by hand.
          PI_GEN_COMMIT: ${{ (inputs.pi_gen_ref == '' || inputs.pi_gen_ref == '2026-10-06-raspios-trixie-arm64') && 'b2cd98a9ee08a31ef7d0110ed09f2492bbd972ec' || '' }}
        run: box/build-image.sh "$PWD/build/knx-box.tar.gz"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name == 'push' && github.ref_type == 'tag'
      - name: Sign image
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          for image in build/knx-box-image/pi-gen/deploy/*.img.xz; do
            cosign sign-blob --yes --bundle "$image.sigstore.json" "$image"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knx-box-image
          path: |
            build/knx-box-image/pi-gen/deploy/*.img.xz
            build/knx-box-image/pi-gen/deploy/*.img.xz.sigstore.json
          compression-level: 0
          retention-days: 1
