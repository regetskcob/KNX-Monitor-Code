# Checks the Dockerfile in the root (image built from the repository alone, for
# people who build it themselves). Only when it or its context rules change:
# the full build takes several minutes and the published images do not use it.
name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - ha-addon/knx_monitor/Dockerfile
      - .github/workflows/docker.yml
      # The compose template is started with the built image below.
      - tool/public-repo/docker/compose.yaml
      # Flutter version check below.
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Same Flutter as the CI
        run: |
          want=$(grep -m1 -oE 'flutter-version: [0-9.]+' .github/workflows/ci.yml | cut -d' ' -f2)
          have=$(grep -m1 -oE '^ARG FLUTTER_VERSION=[0-9.]+' Dockerfile | cut -d= -f2)
          [ "$want" = "$have" ] || { echo "::error::Dockerfile has Flutter $have, the CI $want"; exit 1; }
      - run: docker build -t knx-monitor-local --build-arg BUILD_VERSION=ci .
      - name: Start and answer
        run: |
          set -e
          docker run -d --name local -e ALLOW_ALL=1 -e BIND=0.0.0.0 -e TZ=Europe/Berlin -p 8765:8765 knx-monitor-local
          for i in $(seq 1 30); do curl -sf http://localhost:8765/api/bus >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8765/api/bus >/dev/null || { docker logs local; exit 1; }
          curl -sf http://localhost:8765/ | grep -q '<base href'
          curl -sf -o /dev/null http://localhost:8765/main.dart.js
          docker stop -t 10 local
      # The published compose template with its hardening (cap_drop, no
      # privileges) against a data folder the host user created, like a user
      # following the README would: the server must start, answer only with the
      # password and keep its data folder to itself.
      - name: Compose template
        run: |
          set -ex
          dir=$RUNNER_TEMP/compose
          mkdir -p "$dir/data"
          sed -E 's#^( *image:).*#\1 knx-monitor-local#' tool/public-repo/docker/compose.yaml >"$dir/compose.yaml"
          pw=ci-compose-pass
          printf 'BOX_PASSWORD=%s\n' "$pw" >"$dir/.env"
          docker compose --project-directory "$dir" -f "$dir/compose.yaml" up -d
          code() { curl -s -o /dev/null -m 5 -w '%{http_code}' "$@"; }
          for i in $(seq 1 30); do [ "$(code -u "x:$pw" http://localhost:8765/api/bus)" = 200 ] && break; sleep 1; done
          trap 'docker compose --project-directory "$dir" -f "$dir/compose.yaml" logs' ERR
          test "$(code -u "x:$pw" http://localhost:8765/api/bus)" = 200
          test "$(code http://localhost:8765/api/bus)" = 401
          test "$(sudo stat -c %a "$dir/data/app")" = 700
          test -z "$(sudo find "$dir/data/app" -type f -perm /077)"
          docker compose --project-directory "$dir" -f "$dir/compose.yaml" down
