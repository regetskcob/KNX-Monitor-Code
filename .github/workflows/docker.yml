# Checks the Dockerfile in the root (image built from the repository alone, for
# people who build it themselves). Only when it or its context rules change:
# the full build takes several minutes and the published images do not use it.
name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - ha-addon/knx_monitor/Dockerfile
      - .github/workflows/docker.yml
      # Flutter version check below.
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Same Flutter as the CI
        run: |
          want=$(grep -m1 -oE 'flutter-version: [0-9.]+' .github/workflows/ci.yml | cut -d' ' -f2)
          have=$(grep -m1 -oE '^ARG FLUTTER_VERSION=[0-9.]+' Dockerfile | cut -d= -f2)
          [ "$want" = "$have" ] || { echo "::error::Dockerfile has Flutter $have, the CI $want"; exit 1; }
      - run: docker build -t knx-monitor-local --build-arg BUILD_VERSION=ci .
      - name: Start and answer
        run: |
          set -e
          docker run -d --name local -e ALLOW_ALL=1 -e TZ=Europe/Berlin -p 8765:8765 knx-monitor-local
          for i in $(seq 1 30); do curl -sf http://localhost:8765/api/bus >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8765/api/bus >/dev/null || { docker logs local; exit 1; }
          curl -sf http://localhost:8765/ | grep -q '<base href'
          curl -sf -o /dev/null http://localhost:8765/main.dart.js
          docker stop -t 10 local
