include: package:flutter_lints/flutter.yaml

analyzer:
  # Stricter than flutter_lints (review 10.11.2026).
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - third_party/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - test_live/**
    # Interne Bauquellen (intern/README.md), nicht Teil der App.
    - intern/**
    - web/**
    # Eigenes Paket mit eigener Analyse (CI-Job addon-server).
    - ha-addon/**
    # Internal packages with their own analysis (verify_extra in tool/werkbank.conf).
    - packages/**
    # Werkzeug für Herstellergrafiken mit eigenem pubspec (älteres xml).
    - tool/device_art/**

formatter:
  page_width: 120

linter:
  rules:
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_print
