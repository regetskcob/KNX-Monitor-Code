# KNX Monitor – teaser for https://knx-monitor.de (Hugo, design system Horizont)
#
# One full-screen page, plus the KNX Box page (/box/): title, mark, the small distribution board with the
# app's generic actuators as an animated drawing. The detailed
# landing page lives in site/ (regetskcob.de/knx/); support, privacy policy and
# account deletion have already moved here.
#
# Served via GitHub Pages from the public repo (branch gh-pages),
# see tool/deploy_teaser.sh. Included: /.well-known/ for the passkeys.
baseURL = "https://knx-monitor.de/"
title = "KNX Monitor"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Last change per page from Git (lastmod in the sitemap).
enableGitInfo = true
disableKinds = ["taxonomy", "term", "rss", "section"]

[params]
  # Ways to buy and texts that require a sale. Off as long as no business is
  # registered; the prices in the roadmap are shown as a preview regardless.
  commerce = false
  # Not in search engines (preview only).
  noindex = false
  # "Add repository" in Home Assistant (my.home-assistant.io).
  haUrl = "https://my.home-assistant.io/redirect/supervisor_add_addon_repository/?repository_url=https%3A%2F%2Fgithub.com%2Fregetskcob%2FKNX-Monitor"
  # Public betas, on per platform only once a build is approved
  # (TestFlight: Beta App Review, Google Play: closed test live).
  # They switch the button, the beta line in the roadmap and the texts that are
  # stored per state (none, ios, android, both) in data/teaser/<lang>.yaml.
  betaIos = false
  # Public source code (GPLv3), hero button and FAQ.
  codeUrl = "https://github.com/regetskcob/KNX-Monitor-Code"
  betaAndroid = false
  githubUrl = "https://github.com/regetskcob/KNX-Monitor"
  instagramUrl = "https://www.instagram.com/knxmonitor/"
  legalUrl = "https://www.regetskcob.de/legal/"
  supportMail = "support@knx-monitor.de"
  # KNX Box image (as on the landing page).
  boxUrl = "https://github.com/regetskcob/KNX-Monitor/releases/tag/box-v1.9.6"

[languages]
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de-DE"
    weight = 1
    [languages.de.params]
      privacyUrl = "/datenschutz/"
      supportUrl = "/support/"
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 2
    [languages.en.params]
      privacyUrl = "/en/privacy/"
      supportUrl = "/en/support/"

# HTML in the data (values in the ETS section, badges), as on the landing page.
[markup.goldmark.renderer]
  unsafe = true

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  # Features and expert mode in detail: texts and screenshots of the landing page.
  [[module.mounts]]
    source = '../site/data'
    target = 'data'
    includeFiles = ['screens.yaml', 'home/*.yaml', 'support/*.yaml']
  # Support, privacy policy and account deletion: the same texts as formerly under
  # regetskcob.de/knx/ (the old addresses redirect here). The
  # terms of use come along as soon as draft is removed there.
  [[module.mounts]]
    source = '../site/content'
    target = 'content'
    includeFiles = ['support.*.md', 'datenschutz.*.md', 'konto-loeschen.*.md', 'nutzungsbedingungen.*.md']
  [[module.mounts]]
    source = '../site/static/images/screens'
    target = 'assets/images/screens'
  # The teaser shares the mark and the OG image with the landing page.
  [[module.mounts]]
    source = '../site/static'
    target = 'static'
    includeFiles = ['favicon.*', 'apple-touch-icon.png', 'icon-*.png', 'site.webmanifest', 'images/og.png']
  [[module.imports]]
    path = 'github.com/regetskcob/horizont'
    [[module.imports.mounts]]
      source = 'tokens'
      target = 'data'
    [[module.imports.mounts]]
      source = 'icons'
      target = 'data/horizont_icons'
      includeFiles = ['*.json']
    [[module.imports.mounts]]
      source = 'web/css'
      target = 'assets/css/horizont'
    [[module.imports.mounts]]
      source = 'web/partials'
      target = 'layouts/_partials/horizont'
    [[module.imports.mounts]]
      source = 'web/js'
      target = 'assets/js/horizont'
    [[module.imports.mounts]]
      source = 'web/fonts'
      target = 'static/fonts'
