# Journal on an SD card: capped so that it neither fills the card nor
# takes space away from the recording.
[Journal]
# Keep it across reboots: Raspberry Pi OS keeps it in memory only
# (40-rpi-volatile-storage.conf), so after a power cut nothing explained
# what had happened. This file sorts after it and wins.
Storage=persistent
SystemMaxUse=64M
SystemKeepFree=256M
RuntimeMaxUse=32M
