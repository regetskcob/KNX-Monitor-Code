# KNX Monitor – landing page ("Feldseite" on the design system Horizont)
#
# Published at https://www.regetskcob.de/knx/ (the Hugo output is copied into the
# website repo under static/knx/). All links/assets go through
# relURL/absURL and therefore work in the subfolder /knx/.
baseURL = "https://www.regetskcob.de/knx/"
title = "KNX Monitor"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
# robots.txt belongs at the domain root (main site); point to knx/sitemap.xml there.
enableRobotsTXT = false
disableKinds = ["taxonomy", "term", "rss"]

[params]
  # Tiers, prices and purchases on the page. Off as long as no business is
  # registered; the preview (tool/deploy_site.sh --preview) turns them on.
  commerce = false
  # Store links – "#" as long as the app is not yet published.
  appStoreUrl = "#"
  playStoreUrl = "#"
  desktopUrl = "https://github.com/regetskcob/KNX-Monitor/releases/latest"
  boxUrl = "https://github.com/regetskcob/KNX-Monitor/releases/tag/box-v1.9.6"
  # Home Assistant add-on repository (Settings → Add-ons → Add-on Store → ⋮ → Repositories)
  haRepoUrl = "https://github.com/regetskcob/KNX-Monitor"
  # Legal notice lives on the main site (applies to DE and EN)
  legalUrl = "https://www.regetskcob.de/legal/"
  githubUrl = "https://github.com/regetskcob/KNX-Monitor"
  ogImage = "images/og.png"
  # Buy page for Windows (Paddle, merchant of record). Empty = not yet
  # available; price IDs are in static/kaufen/angebote.json (the app reads
  # them too). customDataKey: field under which RevenueCat expects the account ID
  # (check in RevenueCat's Paddle guide).
  [params.paddle]
    environment = "sandbox"
    clientToken = ""
    customDataKey = "app_user_id"

[languages]
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de-DE"
    weight = 1
    [languages.de.params]
      description = "KNX Monitor: moderner KNX-Busmonitor und Diagnose für iPhone, iPad, Android und Home Assistant. Liest ETS-Projekte, prüft die Anlage, deine Daten bleiben lokal. Kostenlos, mit Plus und Pro."
      description_live = "KNX Monitor: moderner KNX-Busmonitor und Diagnose für iPhone, iPad, Android und Home Assistant. Liest ETS-Projekte, prüft die Anlage, deine Daten bleiben lokal."
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 2
    [languages.en.params]
      description = "KNX Monitor: a modern KNX bus monitor and diagnostics tool for iPhone, iPad, Android and Home Assistant. Reads ETS projects, checks your installation, your data stays local. Free, with Plus and Pro."
      description_live = "KNX Monitor: a modern KNX bus monitor and diagnostics tool for iPhone, iPad, Android and Home Assistant. Reads ETS projects, checks your installation, your data stays local."

[sitemap]
  changeFreq = "monthly"

[markup.goldmark.renderer]
  unsafe = true  # allows <span class="todo"> in Markdown (own content)

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false

# Horizont (github.com/regetskcob/horizont) as a Hugo module, pinned to a tag.
# The mounts are the ones from the module's docs/web.md: tokens, CSS, partials,
# shortcodes and the fonts (served locally, never from Google Fonts).
# Update: hugo mod get github.com/regetskcob/horizont@vX.Y.Z
[module]
  # Own folders as usual, plus the screenshots from static/images/screens
  # (generated by tool/launch_graphics.py) also as assets, so that the
  # device frame can crop them and serve them as WebP.
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
    files = ['! images/screens/**', '! images/highlights/**', '! images/banner.png']
  [[module.mounts]]
    source = 'static/images/screens'
    target = 'assets/images/screens'
  [[module.mounts]]
    source = 'static/images/highlights'
    target = 'assets/images/highlights'
  [[module.imports]]
    path = 'github.com/regetskcob/horizont'
    [[module.imports.mounts]]
      source = 'tokens'
      target = 'data'
    [[module.imports.mounts]]
      source = 'icons'
      target = 'data/horizont_icons'
      includeFiles = ['*.json']
    [[module.imports.mounts]]
      source = 'web/css'
      target = 'assets/css/horizont'
    [[module.imports.mounts]]
      source = 'web/partials'
      target = 'layouts/_partials/horizont'
    [[module.imports.mounts]]
      source = 'web/shortcodes'
      target = 'layouts/_shortcodes'
    [[module.imports.mounts]]
      source = 'web/js'
      target = 'assets/js/horizont'
    [[module.imports.mounts]]
      source = 'web/fonts'
      target = 'static/fonts'
