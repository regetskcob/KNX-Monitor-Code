# KNX Monitor – website https://knx-monitor.de (Hugo, design system Horizont)
#
# One full-screen page, plus the KNX Box page (/box/): title, mark, the small distribution board with the
# app's generic actuators as an animated drawing; support, privacy policy, account
# deletion and the legal drafts. Draft pages (layouts baseof, store, header,
# appheader, kaufen; partials in _partials/drafts/) render only with `hugo server -D`
# and make the store graphics and headers. regetskcob.de/knx/ redirects here.
#
# Served via GitHub Pages from the public repo (branch gh-pages),
# see tool/release.sh site (werkbank, WB_SITES). Included: /.well-known/ for the
# passkeys; /socials/ is built from store/social/ on deploy (tool/social/preview.py).
baseURL = "https://knx-monitor.de/"
title = "KNX Monitor"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Last change per page from Git (lastmod in the sitemap).
enableGitInfo = true
disableKinds = ["taxonomy", "term", "rss", "section"]

[params]
  # Ways to buy and texts that require a sale. Off as long as no business is
  # registered; the prices in the roadmap are shown as a preview regardless.
  commerce = false
  # Not in search engines (preview only).
  noindex = false
  # "Add repository" in Home Assistant (my.home-assistant.io).
  haUrl = "https://my.home-assistant.io/redirect/supervisor_add_addon_repository/?repository_url=https%3A%2F%2Fgithub.com%2Fregetskcob%2FKNX-Monitor"
  # Public betas, on per platform only once a build is approved
  # (TestFlight: Beta App Review, Google Play: closed test live).
  # They switch the button, the beta line in the roadmap and the texts that are
  # stored per state (none, ios, android, both) in data/site/<lang>.yaml.
  betaIos = false
  # Public source code (GPLv3), hero button and FAQ.
  codeUrl = "https://github.com/regetskcob/KNX-Monitor-Code"
  betaAndroid = false
  githubUrl = "https://github.com/regetskcob/KNX-Monitor"
  instagramUrl = "https://www.instagram.com/knxmonitor/"
  legalUrl = "https://www.regetskcob.de/legal/"
  supportMail = "support@knx-monitor.de"
  # KNX Box image (as on the landing page).
  boxUrl = "https://github.com/regetskcob/KNX-Monitor/releases/tag/box-v1.9.10"
  # For the draft pages (store graphics, headers, buy page; layouts baseof, store,
  # header, appheader, kaufen with partials in _partials/drafts/).
  ogImage = "images/og.png"
  # Buy page for Windows (Paddle, merchant of record). Empty = not yet
  # available; price IDs are in static/kaufen/angebote.json (the app reads
  # them too). customDataKey: field under which RevenueCat expects the account ID.
  [params.paddle]
    environment = "sandbox"
    clientToken = ""
    customDataKey = "app_user_id"

[languages]
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de-DE"
    weight = 1
    [languages.de.params]
      privacyUrl = "/datenschutz/"
      supportUrl = "/support/"
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 2
    [languages.en.params]
      privacyUrl = "/en/privacy/"
      supportUrl = "/en/support/"

# HTML in the data (values in the ETS section, badges), as on the landing page.
[markup.goldmark.renderer]
  unsafe = true

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  # Screenshots (static/images/screens/) also as resources for image processing.
  [[module.mounts]]
    source = 'static/images/screens'
    target = 'assets/images/screens'
  [[module.imports]]
    path = 'github.com/regetskcob/horizont'
    [[module.imports.mounts]]
      source = 'tokens'
      target = 'data'
    [[module.imports.mounts]]
      source = 'icons'
      target = 'data/horizont_icons'
      files = ['*.json']
    [[module.imports.mounts]]
      source = 'web/css'
      target = 'assets/css/horizont'
    [[module.imports.mounts]]
      source = 'web/partials'
      target = 'layouts/_partials/horizont'
    [[module.imports.mounts]]
      source = 'web/js'
      target = 'assets/js/horizont'
    [[module.imports.mounts]]
      source = 'web/fonts'
      target = 'static/fonts'
