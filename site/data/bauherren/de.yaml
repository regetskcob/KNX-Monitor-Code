plan:
  label: Grundriss
  title: Auf dem Plan siehst du, ob es im Alltag passt.
  text: Grundriss hochladen, Geräte setzen, fertig ist der Blick auf Türen, Möbel und Wege. Leuchten sind schaltbar, dimmbar, in der Lichtfarbe verstellbar oder farbig, Steckdosen haben Dauerstrom, lassen sich schalten oder messen zusätzlich den Strom, am Fenster sitzt ein Rollladen oder ein Raffstore mit Lamellen. Daraus rechnet der Plan den Kanalbedarf aus. **Probier es aus:** Tippe ein Gerät an und ändere seine Art.
  caption: Beispielhaus. Kanäle mit 30 % Reserve, Abstände aus dem Maßstab.
  words:
    decimal: ','
    rooms:
      living: Wohnen & Essen
      kitchen: Küche
      hall: Diele
      office: Büro
    kinds:
      light: Leuchte
      socket: Steckdose
      button: Taster
      blind: Rollladen
    modes:
      dim: Dimmbar
      switch: Schaltbar
      perm: Dauerstrom
      roller: Rollladen
      slat: Raffstore mit Lamellen
      tw: Lichtfarbe (Tunable White)
      rgb: Farbig (RGB)
      meter: Mit Strommessung
    height: Höhe über Boden
    distance: Abstand zur Wand
    count:
      switch: Schaltkanäle
      dim: Dimmkanäle
      perm: Steckdosen mit Dauerstrom
      blind: Jalousiekanäle
      led: LED-Kanäle oder DALI
      meter: Schaltkanäle mit Messung
    hint_wrong: Der Taster liegt hinter der geöffneten Tür.
    hint_fix: Auf die Griffseite setzen
    hint_ok: Der Taster sitzt jetzt auf der Griffseite.
electrician:
  label: Mit dem Elektriker
  title: Unterlagen, mit denen dein Elektriker weiterarbeiten kann.
  text: Du gehst den Plan mit deinem Elektriker durch und gibst ihm eine saubere Aufstellung mit. Die Abstimmung läuft dabei über diese Unterlagen, nicht in der App.
  points:
  - term: Raumbuch
    value: Wünsche je Raum, Priorität und welche Art jede Leuchte und Steckdose hat
  - term: Kanalbedarf
    value: Schalten, Dimmen, Jalousie und Heizung, jeweils mit Reserve. Aktoren und Verteiler legt dein Fachbetrieb fest
  - term: Ohne Plus
    value: Wünschen mit acht Momenten, Raumbuch, eine Ebene mit Grundriss, Kanalbedarf, PDF ohne Maße, CSV und die Hausplan-Datei
  - term: Mit Plus
    value: Weitere Ebenen und Außenbereich, Prüfungen, Wetterregeln, Fristen je Bauart, Angebots-Check, PDF mit Maßen und DXF
  - term: Fristen
    value: Was vor dem Betonieren, der Rohinstallation und dem Verputzen feststehen sollte, passend zur Bauart
technical:
  label: Geplant
  title: Später soll der Grundriss zum Blick auf deinen Bus werden.
  text: Das ist noch nicht gebaut. Geräte aus dem Plan sollen ihre Gruppenadressen bekommen, damit du Zustände und Telegramme dort siehst, wo sie im Haus passieren. Geplant ist das auch ohne das Paket, mit jedem eigenen Grundriss.
  points:
  - term: Soll-Ist
    value: 'Geführter Rundgang durchs Raumbuch: auslösen, hinschauen, abhaken, Mängel notieren'
  - term: Bus
    value: Telegramme blinken am Gerät, stumme Geräte fallen auf
  - term: Abstimmen
    value: Fragen und Änderungsvorschläge gemeinsam mit dem Fachbetrieb direkt am Plan, freigegebene Stände
  - term: Fokus
    value: Eine technische Ansicht für Diagnose und Prüfung. Für die tägliche Bedienung bleibt Home Assistant oder deine Visualisierung
state:
  label: Stand
  title: Die erste Stufe ist gebaut, die Apps sind noch im Test.
  text: In der App heißt sie „Haus planen“. Herunterladen kannst du sie noch nicht, die Apps sind nicht öffentlich. Die Demos auf dieser Seite zeigen die Idee.
  points:
  - term: Gebaut
    value: Planen ohne Bus und ohne ETS, von den Wünschen bis zu den Unterlagen
  - term: Noch nicht dabei
    value: Abstimmung mit dem Fachbetrieb, Soll-Ist-Rundgang und die Ansicht am Bus
  - term: Einstufung
    value: Funktionskatalog und Fristen entstehen nach bestem Wissen und sind noch nicht fachlich geprüft. Der Katalog startet mit 27 Einträgen. Dein Fachbetrieb hat das letzte Wort
  - term: Mitreden
    value: Du baust gerade oder planst KNX? Schreib uns unter [Feedback](/feedback/), was dir bei der Planung am meisten fehlt
faq:
  label: Fragen
  title: Häufige Fragen
  items:
  - q: Ersetzt das Paket meinen Elektriker oder Planer?
    a: Das Paket hilft dir, deine Wünsche zu klären und sauber zu übergeben. Elektroinstallation, Aktoren, Verteiler und Absicherung bleiben Sache deines Fachbetriebs, die Lichtplanung die eines Lichtplaners.
  - q: Sagt mir die App, was KNX kostet?
    a: 'Sie zeigt dir, was sich aus dem Plan berechnen lässt: Kanäle, Geräte und Reserve. Damit vergleichst du Angebote auf derselben Grundlage. Die Preise kommen aus dem Angebot deines Betriebs.'
  - q: Wo liegen mein Grundriss und meine Wünsche?
    a: Auf deinem Gerät. Weitergeben kannst du sie als Datei, selbst und nur, wenn du willst.
  - q: Brauche ich dafür eine fertige KNX-Anlage?
    a: Nein, die Planung läuft ganz ohne Bus und ohne ETS.
  - q: Wann kommt es?
    a: Die erste Stufe kommt mit den Apps, und die sind noch im Test. Einen Termin nennen wir deshalb nicht. Neuigkeiten gibt es auf [Instagram](https://www.instagram.com/busclear.app/).
