header:
  kennung: "Busmonitor & Diagnose · alle Plattformen"
  text: "Jedes Telegramm live, dein ETS-Projekt als Klartext, und im Expertenmodus die ganze Werkstatt."


features:
  label: "Funktionen"
  title: "Alles, was du am Bus brauchst."
  lead: "Ohne Expertenmodus bleibt die App schlank: die Werte, die Telegramme und eine Prüfung der Anlage."
  items:
    - term: "Übersicht"
      title: "Übersicht & Favoriten"
      text: "Jede Gruppenadresse als Karte mit aktuellem Wert und Mini-Verlauf, sortiert nach Räumen und Funktionen aus deinem Projekt. Diagramme speicherst du je Anlage, sie stehen als eigener Abschnitt in der Übersicht."
    - term: "Telegramme"
      title: "Live-Telegramme"
      text: "Jedes Telegramm mit Absender, Ziel, Wert und Auffälligkeiten. Suche in der Titelleiste, ein Filterknopf mit Zählern, Werte lesen und schreiben. Schreiben ist ein Eingriff in die Anlage und geschieht auf deine Verantwortung."
    - term: "Objekte"
      title: "Räume & Objekte"
      text: "Befehle und Rückmeldungen automatisch zusammengefasst, Aktoren als Hutschienengeräte mit Kanal-LEDs."
    - term: "Gesundheit"
      title: "Gesundheit"
      text: "Liest Status-Adressen, meldet verstummte Geräte und prüft Zyklen, Werte, Datentypen und Busqualität. Mit PDF-Bericht."
    - term: "Aufnahmen"
      title: "Aufnahmen & Verlauf"
      text: "Aufnehmen mit Name und Notiz; langes Drücken nimmt die letzten 10 Sekunden mit. Vor dem Abspielen Werte ändern, Telegramme entfernen, als Kopie speichern; Wiedergabe mit Zeitleiste je Gruppenadresse, 1–60×. Mit Plus dazu Langzeitverlauf und Statistik mit Aktivitäts-Heatmap."
      text_live: "Aufnehmen mit Name und Notiz; langes Drücken nimmt die letzten 10 Sekunden mit. Vor dem Abspielen Werte ändern, Telegramme entfernen, als Kopie speichern; Wiedergabe mit Zeitleiste je Gruppenadresse, 1–60×. Dazu Langzeitverlauf und Statistik mit Aktivitäts-Heatmap."
    - term: "Secure"
      title: "KNX Secure & Routing"
      text: "Tunnel über UDP oder TCP, Routing per Multicast, KNX IP Secure und Data Secure mit dem Keyring aus der ETS."
  more:
    label: "Außerdem"
    title: "Und was sonst am Bus hilft."
    points:
      - { term: "Kommentare", value: "An Telegrammen, Diagrammen und Aufnahmen, mit bis zu drei Bildschirmfotos" }
      - { term: "Exporte", value: "Eine Seite für alles: Telegramme als CSV und einfaches PDF in jeder Stufe, ab Plus volles PDF und ETS-Datei, Berichte und ein ZIP mit allem", value_live: "Eine Seite für alles: Telegramme als PDF, CSV und für die ETS, Berichte und ein ZIP mit allem" }
      - { term: "Fehler", value: "**Problem melden:** Fehler nachstellen, jedes Auftreten antippen, das Diagnosepaket geht an den Elektriker; beim Öffnen zeigt es Befunde und Hinweise. Für den Support auf Wunsch ohne Namen" }
      - { term: "Einstieg", value: "**Ohne ETS-Projekt anlernen:** Taster drücken, benennen, fertig. Ohne Expertenmodus zeigt die Live-Liste jedes Telegramm als Satz; dazu Verbindungshilfe, Ampel mit Wochenbericht und „KNX lernen“" }
      - { term: "Sicherung", value: "**Alles in einer Datei** mit eigenem Passwort, in den Apps ab Version 1.9.1" }
      - { term: "Demo", value: "Demo-Haus zum Ausprobieren ohne Anlage" }
      - { term: "Sprachen", value: "Deutsch und Englisch" }

expert:
  label: "Expertenmodus"
  title: "Ein Schalter, und die ganze Werkstatt ist da."
  text: "Für Inbetriebnahme, Fehlersuche und Übergabe. Den Expertenmodus schaltest du auf dem Verbindungsbildschirm oder ganz unten im Menü ein; im Home-Assistant-Add-on ist er von Anfang an an. Ohne ihn geht nichts verloren, die Werkzeuge bleiben nur aus dem Weg. Diagramme und Alarm-Mitteilungen gehören zu Plus, Busmonitor, Diagnose, Inbetriebnahme, Topologie und zyklisches Senden zu Pro; im Demo-Haus probierst du alle aus."
  text_live: "Für Inbetriebnahme, Fehlersuche und Übergabe. Den Expertenmodus schaltest du auf dem Verbindungsbildschirm oder ganz unten im Menü ein; im Home-Assistant-Add-on ist er von Anfang an an. Ohne ihn geht nichts verloren, die Werkzeuge bleiben nur aus dem Weg. Im Demo-Haus probierst du alle Werkzeuge aus."
  points:
    - { term: "Busmonitor", value: "**Rohframes** mit ACK/NAK, Wiederholungen und Buslast" }
    - { term: "Checkliste", value: "**Inbetriebnahme:** Checkliste aller Status-Adressen, Antworten werden abgehakt, PDF-Protokoll mit Unterschriftsfeld" }
    - { term: "Diagnose", value: "**Status lesen**, Programmiermodus finden, Adressen prüfen, Linien scannen" }
    - { term: "Topologie", value: "**Karte und Topologie:** wer mit wem spricht, Linien, Koppler und Kopplerverkehr, Tunnel" }
    - { term: "Abgleich", value: "**Busverkehr gegen ETS-Projekt:** was fehlt, was unbekannt ist, was nie sendet; dazu die Flags der Objekte (Ü, L, K) schon ohne Busverkehr" }
    - { term: "Diagramme", value: "**Bis zu acht Adressen**, eine Achse je Einheit, gespeichert je Anlage" }
    - { term: "Trigger", value: "**Trigger-Aufnahme** für sporadische Fehler: startet bei Wert, Störung, Wiederholung oder unbeantworteter Leseanfrage, mit Vorlauf" }
    - { term: "Senden", value: "**Wie im ETS-Gruppenmonitor:** verzögert und zyklisch, mehr Datentypen (Text, Zeit, Datum, Farbe …), Datentyp je Adresse festlegen" }
    - { term: "Wiedergabe", value: "**Aufnahme auf den Bus spielen:** Adressen wählen, Werte ändern, Pausen kürzen, dann ausdrücklich bestätigen" }
    - { term: "Hop-Count", value: "**Eigene Spalte** in der Live-Liste, Hinweis bei ungewöhnlichem Routing-Zähler, Einbauort beim Absender" }
    - { term: "Verbindung", value: "**Port, Tunneladresse,** Verbindungsoptionen und Keyring direkt beim Verbinden" }
    - { term: "Alarme", value: "**Alarm-Mitteilungen**, sobald ein Alarm- oder Störungsobjekt auslöst" }
    - { term: "Abnahme", value: "**Durchklingeln mit Klangquittung** und Abnahmeprotokoll mit Unterschrift auf dem Gerät" }
    - { term: "Fehlerjagd", value: "**Sporadische Fehler** über Tage fangen, mit der Busclear Box" }
    - { term: "Fotodoku", value: "**Fotos des Verteilers** und Etiketten mit QR-Code, je Anlage" }

