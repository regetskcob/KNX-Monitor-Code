privacy:
  label: "Datenschutz"
  title: "Deine Daten gehören dir."
  text: "Busclear arbeitet in deinem Netz und speichert auf deinen Geräten. Wir haben die Systeme deutlich gehärtet, die Kontrolle bleibt bei dir: Du brauchst kein Konto, und die App schickt Projekt, Telegramme und Schlüssel von sich aus an niemanden. In den Store-Versionen fragt sie RevenueCat nach deinem Kaufstand, auch wenn du nichts gekauft hast; das Konto gibt es für Käufe, nicht für deine Anlage."
  text_live: "Busclear arbeitet in deinem Netz und speichert auf deinen Geräten. Wir haben die Systeme deutlich gehärtet, die Kontrolle bleibt bei dir: Du brauchst kein Konto, und die App schickt Projekt, Telegramme und Schlüssel von sich aus an niemanden."
  points:
    - { term: "Lokal", value: "Projekt, Telegramme, Aufnahmen und Schlüssel liegen auf deinem Gerät, deiner Box oder deinem Home Assistant, nicht bei uns. Das Passwort deines ETS-Projekts wird nicht gespeichert", home: true }
    - { term: "Tracking", value: "Keine Analyse- und Werbebibliotheken, kein Tracking", home: true }
    - { term: "Verschlüsselt", value: "Ab Version 1.9.1 verschlüsseln die Apps ihre Dateien mit AES-256-GCM, der Schlüssel liegt im Schlüsselbund des Systems. Ohne nutzbaren Schlüsselbund (Linux ohne libsecret) und bei Einstellungen wie dem Gateway bleibt es unverschlüsselt; Add-on und Box verschlüsseln ihre Dateien nicht selbst" }
    - { term: "App-Sperre", value: "Auf Wunsch mit Face ID, Fingerabdruck, Windows Hello, Gerätecode oder App-Passwort samt Notfallschlüssel als PDF. Das hilft, wenn das Gerät in falsche Hände gerät, nicht gegen Schadsoftware unter deinem Benutzerkonto" }
    - { term: "Sicherung", value: "In den Apps in jeder Stufe: alles in eine Datei mit eigenem Passwort, das Format ist offen beschrieben. Das Passwort kann niemand zurücksetzen, auch wir nicht", value_live: "In den Apps: alles in eine Datei mit eigenem Passwort, das Format ist offen beschrieben. Das Passwort kann niemand zurücksetzen, auch wir nicht" }
    - { term: "Ohne Internet", value: "Add-on und Box brauchen kein Internet. Daten gehen nur an Ziele, die du selbst einrichtest", home: true }
    - { term: "Netzwerk", value: "Die App spricht mit deinem Gateway und deiner Busclear Box. Ausnahmen: Käufe (App Store bzw. Google Play und RevenueCat, mit zufälliger Kennung) und der QR-Scanner unter Android (technische Daten an Google ML Kit)", value_live: "Die App spricht mit deinem Gateway und deiner Busclear Box. Ausnahme: Der QR-Scanner unter Android sendet technische Daten an Google ML Kit, nie das Kamerabild" }
