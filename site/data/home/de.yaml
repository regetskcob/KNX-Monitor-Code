hero:
  tagline: "KNX-Busmonitor & Diagnose"
  kennung: "01 — Busmonitor & Diagnose · iPhone · iPad · Android · Mac · Windows · Linux · Home Assistant"
  title: "Sieh, was auf deinem KNX-Bus passiert."
  lead: "Busclear zeigt jedes Telegramm, ordnet es mit deinem ETS-Projekt ein und prüft deine Anlage auf stille Sensoren, falsche Datentypen und Busprobleme. Auf iPhone, iPad, Android, am Desktop und in Home Assistant."
  note: "Verbindet sich per KNXnet/IP mit deiner IP-Schnittstelle oder deinem IP-Router, auch mit KNX Secure. Du brauchst kein Konto, und deine Anlagendaten verlassen dein Netzwerk nur, wenn du sie selbst teilst."
  primary: "Für Linux laden"
  secondary: "Als Add-on installieren"
  screen_alt: "Busclear auf iPad, iPhone, Mac und Android: Übersicht, Live-Telegramme und Werte aus dem Demo-Haus"
  badges:
    appstore: { term: "App Store", small: "Laden im", label: "App Store" }
    play: { term: "Google Play", small: "Jetzt bei", label: "Google Play" }
    desktop: { term: "Desktop", small: "Download für", label: "Linux" }
    ha: { term: "Add-on", small: "Installieren als", label: "Home Assistant Add-on" }

highlights:
  label: "Highlights"
  title: "Deine Anlage, wie du sie noch nie gesehen hast."
  text: "Aus Gruppenadressen werden Geräte, Räume und Verläufe: alles, was dein ETS-Projekt weiß, verbunden mit dem, was gerade auf dem Bus passiert."
  items:
    - file: topology.png
      term: "Topologie"
      title: "Der Schaltschrank, live."
      text: "Linien, Koppler und jedes Gerät, wie es im Verteiler sitzt: Aktoren mit Kanal-LEDs, Taster, Melder und Wetterstation. Jedes Telegramm läuft als Puls über das Buskabel, links der Gerätebaum wie in der ETS."
    - file: overview.png
      term: "Übersicht"
      title: "Jede Adresse mit ihrem Wert."
      text: "Karten nach Funktionen und Räumen aus deinem Projekt, mit Mini-Verlauf und Durchschnitt; Alarme und Störungen ganz oben. Werkzeuge stehen in der Seitenleiste daneben."
    - file: charts.png
      term: "Diagramme"
      title: "Vergleichen, was zusammengehört."
      text: "Temperaturen und Stellwerte auf einer Achse je Einheit, Schaltzustände als eigene Zeilen darunter, mit einem Fadenkreuz über alles. Vorbereitet mit Projektadressen, bevor das erste Telegramm kommt."

