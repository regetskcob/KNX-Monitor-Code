faq:
  label: "FAQ"
  title: "Häufige Fragen"
  # home: true also stands on the home page; all of them on /support/.
  items:
    - q: "Kann ich die App ohne KNX-Anlage ausprobieren?"
      home: true
      a: "Ja. „Demo ohne Anlage ansehen“ auf dem Startbildschirm öffnet ein Musterhaus mit Projekt und Live-Werten. Dein eigenes Projekt bleibt unberührt."
    - commerce: true
      q: "Was kostet Busclear?"
      a: "Die App ist kostenlos und bleibt für den Alltag nützlich. Plus kostet 24,99 € im Jahr oder 79 € einmalig, Pro 149 € im Jahr oder 14,99 € im Monat, mit Probezeit. Das Home-Assistant-Add-on und die Linux-Version sind dauerhaft frei. Im Demo-Haus kannst du vorher alles ausprobieren, auch Pro. Ein Abo kündigst du jederzeit in deinem App-Store- bzw. Google-Play-Konto."
    - q: "Welche KNX-Schnittstellen werden unterstützt?"
      home: true
      a: "Jede KNXnet/IP-Schnittstelle und jeder IP-Router, etwa ein Gira X1. Getunnelt wird über UDP oder TCP; mit einem IP-Router geht auch Routing, das keinen Tunnel belegt (auf iPhone und iPad noch nicht, dort braucht Multicast eine Freigabe von Apple). USB- und serielle Schnittstellen unterstützt die App nicht; die Busclear Box kann die Busleitung über das Aufsteckmodul kBerry direkt anschließen."
    - q: "Warum kann ich keine Verbindung aufbauen, obwohl die Schnittstelle erreichbar ist?"
      a: "IP-Schnittstellen haben nur wenige Tunnel, oft vier oder weniger. Sind alle von Visualisierung, ETS oder anderen Apps belegt, lehnt die Schnittstelle ab. Gib einen Tunnel frei, richte in der ETS einen zusätzlichen ein oder nutze Routing."
    - q: "Wird KNX Secure unterstützt?"
      home: true
      a: "Ja: KNX IP Secure für den Tunnel und KNX Data Secure für verschlüsselte Gruppenadressen. Importiere dazu den Keyring (.knxkeys) aus der ETS. Die Schlüssel liegen im Schlüsselbund deines Geräts. Klappt etwas mit deiner Schnittstelle nicht, [melde es gern auf GitHub](https://github.com/regetskcob/KNX-Monitor/issues)."
    - q: "Wie sichere ich meine Daten, und wer kommt daran?"
      a: "Ab Version 1.9.1 speichert die App auf Wunsch alles von diesem Gerät in eine Datei mit eigenem Passwort (mindestens 12 Zeichen). Sie liegt, wo du sie ablegst, und niemand kann das Passwort zurücksetzen, auch wir nicht. Nicht enthalten sind die App-Sperre und der Verlauf auf einer Box. Einzelheiten stehen in der [Datenschutzerklärung](https://busclear.de/datenschutz/)."
    - q: "Brauche ich ein ETS-Projekt?"
      home: true
      a: "Nein, der Busmonitor funktioniert auch ohne, und du kannst deine Anlage ohne ETS anlernen. Mit Projekt bekommst du Namen, Datentypen, Räume und bessere Prüfungen. Das Passwort eines geschützten Projekts wird nur beim Import verwendet und nicht gespeichert."
    - q: "Wie bekomme ich die Desktop-Version?"
      a: "Linux kann dasselbe wie die App auf dem iPad. Den Download findest du im [Release auf GitHub](https://github.com/regetskcob/KNX-Monitor/releases/latest). Windows folgt in den nächsten Wochen, für den Mac kommt Busclear über den App Store."
    - q: "Was brauche ich für die Busclear Box?"
      a: "Einen Raspberry Pi 4 (getestet) oder 5, am besten mit USB-SSD und Echtzeituhr (Pi 5: Akku), dazu ein IP-Gateway oder das Aufsteckmodul kBerry und die App: auf iPhone, iPad und Android derzeit als Beta, für Linux schon heute. Die Uhr stellt die Box auch nach dem iPhone oder dem KNX-Zeitgeber. Das fertige Image findest du in den [Releases auf GitHub](https://github.com/regetskcob/KNX-Monitor/releases), alles Weitere auf der [Seite zur Busclear Box](https://busclear.de/box/)."

