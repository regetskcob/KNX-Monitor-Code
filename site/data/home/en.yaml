hero:
  tagline: "KNX bus monitor & diagnostics"
  kennung: "01 — Bus monitor & diagnostics · iPhone · iPad · Android · Mac · Windows · Linux · Home Assistant"
  title: "See what happens on your KNX bus."
  lead: "KNX Monitor shows every telegram, puts it in context with your ETS project and checks your installation for silent sensors, wrong datapoint types and bus problems. On iPhone, iPad, Android, desktop and in Home Assistant."
  note: "Connects via KNXnet/IP to your IP interface or IP router, KNX Secure included. You need no account, and your installation data only leaves your network if you share it yourself."
  primary: "Get it for Linux"
  secondary: "Install as add-on"
  screen_alt: "KNX Monitor on iPad, iPhone, Mac and Android: overview, live telegrams and values from the demo house"
  badges:
    appstore: { term: "App Store", small: "Download on the", label: "App Store" }
    play: { term: "Google Play", small: "Get it on", label: "Google Play" }
    desktop: { term: "Desktop", small: "Download for", label: "Linux" }
    ha: { term: "Add-on", small: "Install as", label: "Home Assistant Add-on" }

highlights:
  label: "Highlights"
  title: "Your installation as you have never seen it."
  text: "Group addresses become devices, rooms and histories: everything your ETS project knows, joined with what is happening on the bus right now."
  items:
    - file: topology.png
      term: "Topology"
      title: "The distribution board, live."
      text: "Lines, couplers and every device as it sits in the cabinet: actuators with channel LEDs, push buttons, detectors and the weather station. Every telegram runs as a pulse along the bus cable, the device tree on the left as in ETS."
    - file: overview.png
      term: "Overview"
      title: "Every address with its value."
      text: "Cards by function and room from your project, with mini history and average; alarms and faults on top. The tools sit in the sidebar next to it."
    - file: charts.png
      term: "Charts"
      title: "Compare what belongs together."
      text: "Temperatures and valve positions on one axis per unit, on/off states as rows of their own below, one crosshair across everything. Prepared with project addresses before the first telegram arrives."

facts:
  - { term: "KNXnet/IP", value: "Tunnelling, routing and KNX Secure" }
  - { term: ".knxproj", value: "ETS projects incl. password-protected ETS6" }
  - { term: "0", value: "Trackers; no account, project and telegrams stay with you" }

connection:
  label: "Connection"
  title: "Straight to your IP interface."

header:
  kennung: "Bus monitor & diagnostics · every platform"
  text: "Every telegram live, your ETS project as plain words, and the whole workshop in expert mode."


features:
  label: "Features"
  title: "Everything you need on the bus."
  lead: "Without expert mode the app stays lean: the values, the telegrams and a check of your installation."
  items:
    - term: "Overview"
      title: "Overview & favourites"
      text: "Every group address as a card with its current value and a mini history, sorted by the rooms and functions of your project. Charts are saved per installation and get their own section on the overview."
    - term: "Telegrams"
      title: "Live telegrams"
      text: "Every telegram with sender, destination, value and anomalies. Search in the title bar, one filter button with counts, read and write values. Writing is an intervention in the installation and is your responsibility."
    - term: "Objects"
      title: "Rooms & objects"
      text: "Commands and feedbacks grouped automatically, actuators drawn as DIN-rail devices with channel LEDs."
    - term: "Health"
      title: "Health"
      text: "Reads status addresses, reports devices that went silent and checks cycles, values, datapoint types and bus quality. With a PDF report."
    - term: "Recordings"
      title: "Recordings & history"
      text: "Record with a name and note; a long press keeps the last 10 seconds. Before a replay, change values, remove telegrams, save as a copy; replay with a timeline per group address, 1–60×. With Plus, long-term history and statistics with an activity heatmap."
      text_live: "Record with a name and note; a long press keeps the last 10 seconds. Before a replay, change values, remove telegrams, save as a copy; replay with a timeline per group address, 1–60×. Also long-term history and statistics with an activity heatmap."
    - term: "Secure"
      title: "KNX Secure & routing"
      text: "Tunnel over UDP or TCP, routing via multicast, KNX IP Secure and Data Secure with the keyring from ETS."
  more:
    label: "Also included"
    title: "And everything else that helps on the bus."
    points:
      - { term: "Comments", value: "On telegrams, charts and recordings, with up to three screenshots" }
      - { term: "Exports", value: "One page for everything: telegrams as CSV and simple PDF in every tier, full PDF and ETS file from Plus, reports and a ZIP with everything", value_live: "One page for everything: telegrams as PDF, CSV and for ETS, reports and a ZIP with everything" }
      - { term: "Bug report", value: "**Report a problem:** reproduce the fault, tap each time it happens, and the diagnostic package goes to your electrician; opened, it shows findings and hints. For support optionally without names" }
      - { term: "Getting started", value: "**Teach in without an ETS project:** press a button, name it, done. Without expert mode the live list shows every telegram as a sentence; plus connection help, a status light with weekly report and “Learn KNX”" }
      - { term: "Backup", value: "**Everything in one file** with its own password, in the apps from version 1.9.1" }
      - { term: "Demo", value: "Demo house to try it without a KNX system" }
      - { term: "Languages", value: "German and English" }

expert:
  label: "Expert mode"
  title: "One switch, and the whole workshop is there."
  text: "For commissioning, troubleshooting and handover. Turn expert mode on on the connect screen or at the bottom of the menu; in the Home Assistant add-on it is on from the start. Without it nothing is lost, the tools just stay out of the way. Charts and alarm notifications are part of Plus, bus monitor, diagnostics, commissioning, topology and cyclic sending part of Pro; try them all in the demo house."
  text_live: "For commissioning, troubleshooting and handover. Turn expert mode on on the connect screen or at the bottom of the menu; in the Home Assistant add-on it is on from the start. Without it nothing is lost, the tools just stay out of the way. Try every tool in the demo house."
  points:
    - { term: "Bus monitor", value: "**Raw frames** with ACK/NAK, repeats and bus load" }
    - { term: "Checklist", value: "**Commissioning:** a checklist of all status addresses, answers are checked off, PDF report with a signature field" }
    - { term: "Diagnostics", value: "**Read status**, find programming mode, check addresses, scan lines" }
    - { term: "Topology", value: "**Map and topology:** who talks to whom, lines, couplers and coupler traffic, tunnels" }
    - { term: "Compare", value: "**Bus traffic against the ETS project:** what is missing, what is unknown, what never sends; plus the object flags (T, R, C) even without bus traffic" }
    - { term: "Charts", value: "**Up to eight addresses**, one axis per unit, saved per installation" }
    - { term: "Trigger", value: "**Trigger recording** for sporadic faults: starts on a value, a fault, a repeat or an unanswered read, with pre-roll" }
    - { term: "Send", value: "**Like the ETS group monitor:** delayed and cyclic, more datapoint types (text, time, date, colour …), set a datapoint type per address" }
    - { term: "Replay", value: "**Play a recording onto the bus:** choose addresses, change values, shorten pauses, then confirm explicitly" }
    - { term: "Hop count", value: "**Its own column** in the live list, a hint on unusual routing counters, installation location next to the sender" }
    - { term: "Connection", value: "**Port, tunnel address,** connection options and keyring right on the connect screen" }
    - { term: "Alarms", value: "**Alarm notifications** as soon as an alarm or fault object fires" }
    - { term: "Acceptance", value: "**Ring-through with sound acknowledgement** and an acceptance report signed on the device" }
    - { term: "Fault hunt", value: "**Catch sporadic faults** over days, with the KNX box" }
    - { term: "Photo docs", value: "**Photos of the distribution board** and labels with QR codes, per installation" }

