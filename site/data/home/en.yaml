etsproject:
  label: "ETS project"
  title: "Your project makes telegrams readable."
  text: "Import your ETS project (.knxproj, password-protected too) or the group address CSV export. KNX Monitor picks up names, datapoint types, devices, rooms and links. 1/2/3 becomes “Living room ceiling light – On”."

setup:
  label: "Setups"
  title: "On your phone, on your desktop or in your smart home."
  items:
    - term: "App"
      title: "App"
      text: "For iPhone, iPad and Mac from the App Store, for Android, plus Windows and Linux. Connect, load your project, get going – for commissioning or a quick look in between."
    - term: "Home Assistant"
      id: home-assistant
      title: "Home Assistant add-on"
      text: "Lives in the sidebar and records around the clock, even with no browser open. All views share one tunnel, and alarms arrive as notifications. Out of the box it sends nothing to the bus, and the \"KNX Monitor\" integration turns it into a device with sensors and triggers."

box:
  label: "KNX box"
  title: "A Raspberry Pi that listens in on site."
  text: "The KNX box records for days, without Home Assistant and without internet, and opens its own Wi-Fi. You set it up with the app: scan the QR code on the label, the app does the rest."
  tag: "Preview"
  points:
    - { term: "Setup", value: "Scan, and the app joins the Wi-Fi, pairs, sets the clock and finds the gateway" }
    - { term: "App", value: "Without the app only the browser is left. Until iPhone, iPad and Android arrive, pair the box with the [Linux app](https://github.com/regetskcob/KNX-Monitor/releases/latest)" }
    - { term: "Connection", value: "A network cable to the IP gateway, or straight on the line with the kBerry plug-on module, then no gateway" }
    - { term: "Clock", value: "Without internet: from the iPhone or iPad, or from the KNX time master on the line" }
    - { term: "Recording", value: "Around the clock, for days; app and box share the project and the history" }
    - { term: "Pro", value: "Pairing the box with the app is part of Pro", commerce: true }
  more: "Setup, connection, recording: all about the KNX box"
  link: "Image for the Raspberry Pi"

