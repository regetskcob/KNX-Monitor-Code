sensors:
  - addr: "1.1.30"
    name: "Glastaster"
    kind: "glass"
    slot: "right"
    display: "21,5 °C"
    keys:
      - { label: "T1", hint: "Licht Küche", to: "1/1/3", text: "Licht Küche", status: "1/4/3", status_text: "Status Licht Küche", device: 2, channel: 2 }
      - { label: "T2", hint: "Licht Flur", to: "1/1/5", text: "Licht Flur", status: "1/4/5", status_text: "Status Licht Flur", device: 2, channel: 4 }
  - addr: "1.1.31"
    name: "Taster 2-fach"
    kind: "push"
    # In the gap under the expert list (section 06), else above the thread.
    slot: "gap top"
    section: "expert"
    note: "Drück ihn ruhig: Genauso drückst du in der Topologie der App die Taster deiner Anlage und siehst, welcher Aktor schaltet. So prüfst du ihre Zuordnungen."
    # Its blind beside it, moved by the status "Position Wohnen" (2/4/1).
    window: { status: "2/4/1", pos: 40, label: "Wohnen" }
    keys:
      - { label: "▲", hint: "Rollladen auf", to: "2/1/1", text: "Rollladen Wohnen", value: "Auf", status: "2/4/1", status_text: "Position Wohnen", status_value: "0 %", device: 3, channel: 0 }
      - { label: "▼", hint: "Rollladen ab", to: "2/1/1", text: "Rollladen Wohnen", value: "Ab", status: "2/4/1", status_text: "Position Wohnen", status_value: "100 %", device: 3, channel: 0 }
