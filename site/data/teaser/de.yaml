live: "Live · Demo-Haus"
live_window: "Letzte 60 s"
more: "Was das Add-on heute kann"
ipad_alt: "Busclear als Add-on in Home Assistant auf dem iPad: links das Menü mit Gesundheit, Inbetriebnahme, Busmonitor, Topologie und mehr, in der Mitte die Übersicht mit Werten je Gruppenadresse, rechts die Details einer Adresse mit Verlauf und Telegramm"
addon:
  kennung: "02 — Heute im Add-on"
  title: "Busmonitor und Diagnose, schon heute in Home Assistant."
  text: "Kostenlos, in der Seitenleiste, auf jedem Gerät mit Home Assistant, unterwegs auch über die Home-Assistant-App. Das Add-on bleibt verbunden und zeichnet auf, auch wenn kein Browser offen ist. Der Quellcode ist offen ([GPLv3 auf GitHub](https://github.com/regetskcob/KNX-Monitor-Code)), du kannst nachsehen, was es auf deinem Bus tut. [Alles zum Add-on](/addon/)"
  facts:
    - { term: "Telegramme", value: "Live mit Absender, Ziel und Wert; Suche, Filter, Werte lesen und schreiben. Schreiben ist ein Eingriff in die Anlage und geschieht auf deine Verantwortung" }
    - { term: "ETS-Projekt", value: "`.knxproj` bis ETS6, auch mit Passwort: Namen, Datentypen, Geräte und Räume" }
    - { term: "Übersicht", value: "Jede Gruppenadresse mit Wert und Mini-Verlauf, nach Räumen und Funktionen" }
    - { term: "Objekte", value: "Aktoren als Hutschienengeräte mit Kanal-LEDs, wie oben" }
    - { term: "Gesundheit", value: "Verstummte Geräte, Zyklen, Datentypen und Busqualität, mit PDF-Bericht" }
    - { term: "Verlauf", value: "Daueraufzeichnung Tag für Tag, Aufnahmen mit Zeitleiste je Gruppenadresse" }
    - { term: "Kommentare", value: "An Telegrammen, Diagrammen und Aufnahmen, mit Bildschirmfotos; „Problem melden“ hält fest, wann der Fehler auftrat" }
    - { term: "Exporte", value: "Eine Seite für PDF, CSV, ETS-Datei, Berichte und ein ZIP mit allem" }
    - { term: "Experten", value: "Busmonitor mit Rohframes, Topologie, Abgleich mit dem ETS-Projekt, Inbetriebnahme-Checkliste" }
    - { term: "Verbindung", value: "Tunneling, Routing und KNX IP Secure" }
    - { term: "Home Assistant", value: "Von Haus aus nur lesend; [Integration](https://github.com/regetskcob/KNX-Monitor-HA) mit Sensoren, Auslösern und Reparaturhinweisen, Ereignisse, Blueprints und MQTT" }
apps:
  kennung: "03 — Bald als App"
  title: "Bald auch ohne Home Assistant, direkt am Gateway."
  text: "Für die Baustelle, den Schaltschrank und das Büro neben der ETS: dieselben Werkzeuge als App auf dem Gerät, das du gerade in der Hand hast."
  facts:
    - { term: "Mobil", value: "iPhone, iPad und Android" }
    - { term: "Desktop", value: "Mac und Windows, Linux schon heute" }
    - { term: "Verbindung", value: "Direkt an deiner IP-Schnittstelle oder deinem IP-Router" }
    - { term: "Vor Ort", value: "ETS-Projekt und Aufnahmen liegen auf dem Gerät, auch ohne Internet" }
roadmap:
  kennung: "04 — Fahrplan"
  title: "Erst zu Hause in Home Assistant, dann auch unterwegs auf der Baustelle."
  text:
    none: "Das Add-on ist fertig und bleibt kostenlos, für Linux gibt es die App schon heute. Die übrigen Apps sind gebaut und folgen in den nächsten Wochen."
    ios: "Das Add-on ist fertig und bleibt kostenlos, für Linux gibt es die App schon heute, für iPhone, iPad und Mac als Beta. Die übrigen Apps sind gebaut und folgen in den nächsten Wochen."
    android: "Das Add-on ist fertig und bleibt kostenlos, für Linux gibt es die App schon heute, für Android als Beta. Die übrigen Apps sind gebaut und folgen in den nächsten Wochen."
    both: "Das Add-on ist fertig und bleibt kostenlos, für Linux gibt es die App schon heute, für iPhone, iPad, Mac und Android als Beta. Die übrigen Apps sind gebaut und folgen in den nächsten Wochen."
  # Öffentlich als Vorschau, links unter dem Text.
  prices_preview: "**In der Beta ist noch alles frei:** Du nutzt alle Funktionen kostenlos, auch die von Plus und Pro. Als Dankeschön bekommst du beim ersten Start der Store-Version 90 Tage Pro auf dem Gerät, auf dem du die Beta genutzt hast. [So machst du mit](/beta/)"
  prices:
    - { name: "Free", price: "Kostenlos", sub: "Für den Blick auf die eigene Anlage" }
    - { name: "Plus", price: "24,99 €", per: "im Jahr", sub: "oder 79 € einmalig · Langzeitverlauf, Diagramme, Wächter, Export" }
    - { name: "Pro", price: "149 €", per: "im Jahr", sub: "oder 14,99 € im Monat · Busmonitor, Topologie, Diagnose, Inbetriebnahme" }
  prices_note: "Preisempfehlung als unverbindliche Vorschau, kaufen kann man noch nichts. Es gelten die Endpreise im App Store und bei Google Play; auf iPhone, iPad und Mac gilt ein Kauf überall."
  # commerce: false nur ohne Preise (params.commerce).
  facts:
    - { term: "Offen", value: "**Quellcode unter GPLv3** [auf GitHub](https://github.com/regetskcob/KNX-Monitor-Code): alles für Einsteiger und Fortgeschrittene in App, Add-on und Busclear Box, nachprüfbar und frei veränderbar" }
    - { term: "Jetzt", value: "**Home-Assistant-Add-on** und **Linux** ([Download](https://github.com/regetskcob/KNX-Monitor/releases/latest)), beide kostenlos für eine Installation, auch künftig" }
    - { term: "Beta", value: "**iPhone, iPad und Mac** über [TestFlight](https://testflight.apple.com/join/fsM3ufJK), offen für alle, mit allen Werkzeugen", when: [ios, both] }
    - { term: "Beta", value: "**Android** über Google Play: erst der [Google-Gruppe beitreten](https://groups.google.com/g/knx-monitor-beta), dann [am Test teilnehmen](https://play.google.com/apps/testing/de.kalkar_it.knxmonitor). Offen für alle, mit allen Werkzeugen", when: [android, both] }
    - { term: "Bald", value: "**iPhone, iPad, Android, Mac und Windows** im App Store, bei Google Play und als Download für Windows", when: [none] }
    - { term: "Bald", value: "**Android und Windows** bei Google Play und als Download", when: [ios] }
    - { term: "Bald", value: "**iPhone, iPad, Mac und Windows** im App Store und als Download für Windows", when: [android] }
    - { term: "Bald", value: "**Windows** als Download", when: [both] }
    - { term: "Hausbau", page: "hausbau", value: "**[KNX im Hausbau](/hausbau/)**: was du früh entscheiden solltest, bevor die Wände zu sind, und wie „Haus planen“ dabei hilft" }
    - { term: "Ausblick", value: "**Bauherren-Paket**: vom Alltagswunsch über Raumbuch und Grundriss bis zu den Unterlagen für den Elektriker. [Mehr dazu](/bauherren/)" }
    - { term: "Vorschau", value: "**[Busclear Box](/box/)**: ein Raspberry Pi als Telegramm-Schreiber vor Ort, zeichnet auf der Baustelle tagelang auf, ohne Home Assistant und ohne Internet. Bis die übrigen Apps erscheinen, richtest du sie mit der Linux-App ein" }
    - { term: "Apps", value: "Kostenlos nutzbar, mehr Werkzeuge mit Plus und Pro. In der Beta ist alles frei.", commerce: false }
