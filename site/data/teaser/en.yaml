sensors:
  - addr: "1.1.30"
    name: "Glass push button"
    kind: "glass"
    slot: "right"
    display: "21.5 °C"
    keys:
      - { label: "T1", hint: "Kitchen light", to: "1/1/3", text: "Kitchen light", status: "1/4/3", status_text: "Kitchen light status", device: 2, channel: 2 }
      - { label: "T2", hint: "Hall light", to: "1/1/5", text: "Hall light", status: "1/4/5", status_text: "Hall light status", device: 2, channel: 4 }
  - addr: "1.1.31"
    name: "Push button, 2 keys"
    kind: "push"
    # In the gap under the expert list (section 06), else above the thread.
    slot: "gap top"
    section: "expert"
    note: "Go ahead and press it: in the app's topology you press the push buttons of your installation the same way and see which actuator switches, to check their assignments."
    # Its blind beside it, moved by the status "Position Wohnen" (2/4/1).
    window: { status: "2/4/1", pos: 40, label: "Living room" }
    keys:
      - { label: "▲", hint: "Blinds up", to: "2/1/1", text: "Living room blinds", value: "Up", status: "2/4/1", status_text: "Living room position", status_value: "0 %", device: 3, channel: 0 }
      - { label: "▼", hint: "Blinds down", to: "2/1/1", text: "Living room blinds", value: "Down", status: "2/4/1", status_text: "Living room position", status_value: "100 %", device: 3, channel: 0 }
