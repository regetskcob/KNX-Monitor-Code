more: "What the add-on does today"
ipad_alt: "Busclear as an add-on in Home Assistant on the iPad: the menu on the left with health, commissioning, bus monitor, topology and more, the overview with values per group address in the middle, the details of one address with history and telegram on the right"
addon:
  kennung: "02 — In the add-on today"
  title: "Bus monitor and diagnostics, in Home Assistant today."
  text: "Free, in the sidebar, on every device with Home Assistant, on the go through the Home Assistant app too. The add-on stays connected and keeps recording, even with no browser open. The source code is open ([GPLv3 on GitHub](https://github.com/regetskcob/KNX-Monitor-Code)), so you can check what it does on your bus. [All about the add-on](/en/addon/)"
  facts:
    - { term: "Telegrams", value: "Live with source, destination and value; search, filter, read and write values. Writing is an intervention in the installation and is your responsibility" }
    - { term: "ETS project", value: "`.knxproj` up to ETS6, password-protected too: names, datapoint types, devices and rooms" }
    - { term: "Overview", value: "Every group address with its value and a mini history, by rooms and functions" }
    - { term: "Objects", value: "Actuators as DIN rail devices with channel LEDs, like above" }
    - { term: "Health", value: "Silent devices, cycles, datapoint types and bus quality, with a PDF report" }
    - { term: "History", value: "Continuous recording day by day, recordings with a timeline per group address" }
    - { term: "Comments", value: "On telegrams, charts and recordings, with screenshots; \"Report a problem\" records when the fault happened" }
    - { term: "Exports", value: "One page for PDF, CSV, ETS file, reports and a ZIP with everything" }
    - { term: "Experts", value: "Bus monitor with raw frames, topology, comparison with the ETS project, commissioning checklist" }
    - { term: "Connection", value: "Tunneling, routing and KNX IP Secure" }
    - { term: "Home Assistant", value: "Read-only by default; [integration](https://github.com/regetskcob/KNX-Monitor-HA) with sensors, triggers and repair hints, events, blueprints and MQTT" }
apps:
  kennung: "03 — Coming as an app"
  title: "Soon without Home Assistant too, right at the gateway."
  text: "For the building site, the distribution board and the office next to ETS: the same tools as an app on whatever device is in your hand."
  facts:
    - { term: "Mobile", value: "iPhone, iPad and Android" }
    - { term: "Desktop", value: "Mac and Windows, Linux today" }
    - { term: "Connection", value: "Directly to your IP interface or IP router" }
    - { term: "On site", value: "ETS project and recordings live on the device, no internet needed" }
roadmap:
  kennung: "04 — Roadmap"
  title: "At home in Home Assistant first, then out on the building site too."
  text:
    none: "The add-on is ready and stays free, and the Linux app is available today. The other apps are built and follow in the coming weeks."
    ios: "The add-on is ready and stays free, the Linux app is available today, and iPhone, iPad and Mac are in beta. The other apps are built and follow in the coming weeks."
    android: "The add-on is ready and stays free, the Linux app is available today, and Android is in beta. The other apps are built and follow in the coming weeks."
    both: "The add-on is ready and stays free, the Linux app is available today, and iPhone, iPad, Mac and Android are in beta. The other apps are built and follow in the coming weeks."
  # Public as a preview, on the left below the text.
  prices_preview: "**Everything is still free in the beta:** you use all features at no cost, including those of Plus and Pro. As a thank-you, you get 90 days of Pro on first launch of the store version, on the device you used the beta on. [How to join](/en/beta/)"
  prices:
    - { name: "Free", price: "Free", sub: "For a look at your own installation" }
    - { name: "Plus", price: "€24.99", per: "a year", sub: "or €79 once · long-term history, charts, watchers, export" }
    - { name: "Pro", price: "€149", per: "a year", sub: "or €14.99 a month · bus monitor, topology, diagnostics, commissioning" }
  prices_note: "Suggested prices as a non-binding preview, nothing can be bought yet. Final prices apply in the App Store and on Google Play; on iPhone, iPad and Mac one purchase works everywhere."
  # commerce: false only without prices (params.commerce).
  facts:
    - { term: "Open", value: "**Source code under GPLv3** [on GitHub](https://github.com/regetskcob/KNX-Monitor-Code): everything for beginners and advanced users in the app, add-on and Busclear Box, open to check and to change" }
    - { term: "Now", value: "**Home Assistant add-on** and **Linux** ([download](https://github.com/regetskcob/KNX-Monitor/releases/latest)), both free for one installation, for good" }
    - { term: "Beta", value: "**iPhone, iPad and Mac** through [TestFlight](https://testflight.apple.com/join/fsM3ufJK), open to everyone, with every tool", when: [ios, both] }
    - { term: "Beta", value: "**Android** on Google Play: first [join the Google group](https://groups.google.com/g/knx-monitor-beta), then [join the test](https://play.google.com/apps/testing/de.kalkar_it.knxmonitor). Open to everyone, with every tool", when: [android, both] }
    - { term: "Soon", value: "**iPhone, iPad, Android, Mac and Windows** in the App Store, on Google Play and as a download for Windows", when: [none] }
    - { term: "Soon", value: "**Android and Windows** on Google Play and as a download", when: [ios] }
    - { term: "Soon", value: "**iPhone, iPad, Mac and Windows** in the App Store and as a download for Windows", when: [android] }
    - { term: "Soon", value: "**Windows** as a download", when: [both] }
    - { term: "Preview", value: "**Home builder package**: from everyday wishes through room book and floor plan to documents for your electrician. [Learn more](/en/bauherren/)" }
    - { term: "Preview", value: "**[KNX box](/en/box/)**: a Raspberry Pi as an on-site telegram recorder, recording for days on the building site, without Home Assistant and without internet. Until the other apps arrive, set it up with the Linux app" }
    - { term: "Apps", value: "Free to use, more tools with Plus and Pro. Everything is free in the beta.", commerce: false }
