kennung: "Fahrplan & Änderungen"
title: "Was kommt, und was schon da ist."
lead: "Eine Leitung, von oben nach unten: oben, woran wir arbeiten und was danach kommen kann, darunter jede Version mit dem, was sie gebracht hat. Termine nennen wir für Kommendes nicht; die Reihenfolge bestimmst du mit deiner Stimme."
vote: "Auf GitHub abstimmen"
