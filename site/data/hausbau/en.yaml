talk:
  label: Have your say
  title: Building right now? Tell us what you miss when planning.
  text: Feedback decides what comes first. On GitHub you vote with 👍 and write how you approached your planning. Electricians and planners are asked too, for example about the format they like to receive. The issue is in German first, with English below.
  primary: To the topic on GitHub
  secondary: Try the prototype
  questions_title: What I would like to hear from you
  questions:
  - What was hardest about your planning?
  - What would you have liked to know earlier?
  - Which devices or functions are missing from the list?
faq:
  label: Questions
  title: Frequently asked questions
  items:
  - q: Does this replace my electrician or planner?
    a: The plan helps you clarify your wishes and hand them over cleanly. Electrical installation, actuators, distribution board and protection stay with your contractor, lighting design with a lighting designer.
  - q: Do I need a KNX installation or ETS for this?
    a: No. Planning works without a bus, without a gateway and without an ETS project. Only the check after moving in needs the running installation.
  - q: Does it work for a renovation too?
    a: Yes. At the start the plan asks where you stand and how the house is built, and matches the deadlines to that.
  - q: How reliable are function catalogue and deadlines?
    a: They are put together to the best of our knowledge and haven't had a professional review yet. Take them as a basis for discussion. What applies to you is decided by your contractor.
  - q: Does the app tell me what KNX costs?
    a: 'It shows what can be calculated from the plan: channels, devices and reserve. That lets you compare quotes on the same basis. Prices come from your contractor''s quote.'
  - q: What is free, and what do I need Plus for?
    a: 'Free are wishes, room book, one level with floor plan, channel count, PDF without dimensions, CSV, the home plan file and sharing. Plus covers checks, deadlines, more levels, dimensions in the PDF, DXF, and linking and walk-through after moving in. The bus on the floor plan has its first level in every tier. In the beta everything is still free, nothing can be bought yet. The tiers are in the [roadmap on the home page](/en/#roadmap).'
  - q: Where do my floor plan and wishes live?
    a: On your device. You can pass them on as a file, yourself and only if you want to.
  - q: How does this differ from the page "Home builder package"?
    a: This page explains the way. The [home builder package](/en/bauherren/) is the clickable prototype for it, with everyday moments and a floor plan to try.
