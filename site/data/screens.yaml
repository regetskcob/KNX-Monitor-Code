# Screenshots for the gallery. Files live in static/images/screens/ (made by
# tool/launch_graphics.py from the demo shots, without a frame) and are also
# mounted as assets (hugo.toml), so Horizont's device frame can crop them and
# serve WebP. Missing files are skipped at build time.
