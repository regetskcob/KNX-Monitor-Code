{{ define "main" }}
{{- /* A text page (Datenschutz): Kennung and title, then the text column. */}}
<article class="knx-page">
  <header class="knx-page-head">
    {{ partial "horizont/kennung.html" (dict "text" (printf "%s · %s" site.Title .Title) "tag" "p") }}
    <h1 class="t-display">{{ .Title }}</h1>
  </header>
  <hr class="hz-feld-horizon">
  <div class="knx-prose t-reading">
    {{ .Content }}
  </div>
</article>
{{ end }}
