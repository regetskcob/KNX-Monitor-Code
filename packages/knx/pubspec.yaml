name: knx
description: >-
  KNX protocol building blocks in pure Dart (addresses, cEMI, KNXnet/IP frames, datapoint types,
  KNX Secure), shared by the KNX Monitor app and its add-on server.
# Internal for now; may be published on pub.dev later (docs/architecture.md).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  # Only for package:knx/secure.dart (AES, SHA-256, PBKDF2).
  pointycastle: ^4.0.0

dev_dependencies:
  test: ^1.25.0
