name: knx_monitor_server
description: Home Assistant add-on server for Busclear (web app, UDP relay, file storage).
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0

dev_dependencies:
  test: ^1.25.0
dependencies:
  # KNX protocol code shared with the app. The Docker build copies packages/
  # into the add-on folder so this path also resolves there (Dockerfile).
  knx:
    path: ../../../packages/knx
  mqtt_client: ^10.14.0
  pdf: ^3.13.1
  pointycastle: ^4.0.0
  qr: ^3.0.3
