name: knx_monitor_server
description: Home Assistant add-on server for Busclear (web app, UDP relay, file storage).
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0

dev_dependencies:
  test: ^1.25.0
dependencies:
  # SHA-256 and PBKDF2 of the box backup: several times faster than pointycastle's when compiled.
  crypto: ^3.0.7
  # KNX protocol core and bus connections, open source (github.com/regetskcob/dart-knx).
  knx: ^0.2.3
  knx_io: ^0.1.0
  mqtt_client: ^10.14.0
  pdf: ^3.13.1
  pointycastle: ^4.0.0
  qr: ^3.0.3
